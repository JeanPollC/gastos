<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1822">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Gastos diarios</title>
<style>
:root{
  --base:#0C1822; --sup:#14242F; --sup2:#1B303E; --linea:#26434F;
  --texto:#E8F1F5; --mudo:#88A3B0;
  --acc:#F5A623; --acc2:#3FC8F0; --pr:#F0699B; --ok:#8BE28B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--base);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
input,button,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh}

.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--base) 72%,rgba(12,24,34,0));
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
.top .sub{margin:2px 0 0;font-size:13px;color:var(--mudo)}
main{padding:4px 16px calc(80px + env(safe-area-inset-bottom))}

/* formulario */
.form{background:var(--sup);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:8px}
.monto{display:flex;align-items:center;gap:6px;background:var(--sup2);border:1px solid var(--linea);border-radius:14px;padding:6px 14px;margin-bottom:12px}
.monto span{font-size:26px;font-weight:600;color:var(--mudo)}
.monto input{flex:1;width:100%;background:transparent;border:0;outline:none;padding:0;min-height:56px;font-size:34px;font-weight:700;letter-spacing:-.02em}
.monto input::placeholder{color:#5C7684}
.monto:focus-within{border-color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media (min-width:420px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--sup2);border:1px solid var(--linea);
  border-radius:12px;padding:8px 4px;font-size:12px;color:var(--mudo);min-height:58px;line-height:1.15;text-align:center}
.cat span{font-size:20px;line-height:1}
.cat.on{background:var(--c);border-color:var(--c);color:#0C1822;font-weight:600}
.fila{display:flex;gap:8px;margin-bottom:12px}
.texto,.fecha{background:var(--sup2);border:1px solid var(--linea);border-radius:12px;padding:12px;min-height:48px;outline:none;color:var(--texto)}
.texto{flex:1;min-width:0}
.texto::placeholder{color:#5C7684}
.texto:focus,.fecha:focus{border-color:var(--acc)}
.fecha{flex:0 0 auto;font-size:14px;max-width:150px;padding:12px 8px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.guardar{flex:1;background:var(--ok);color:#0A2113;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;min-height:52px}
.guardar[disabled]{background:var(--sup2);color:var(--mudo)}
.mini{background:var(--sup2);border:1px solid var(--linea);color:var(--texto);border-radius:12px;padding:9px 14px;font-size:14px;min-height:44px}
.mini:active{background:#24414F}
.borrar{background:none;border:1px solid #6B2C3C;color:var(--pr);border-radius:12px;padding:9px 14px;font-size:14px;min-height:44px}
.enlace{background:none;border:0;color:var(--acc2);font-size:13px;padding:6px 4px;min-height:32px}

/* listas de gastos */
.seccion{margin:18px 0 8px;font-size:13px;color:var(--mudo);display:flex;justify-content:space-between;gap:12px}
.seccion b{color:var(--texto);font-weight:600}
.movs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mov-btn{width:100%;display:flex;align-items:center;gap:12px;background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:10px 12px;text-align:left;min-height:58px}
.mov.edit .mov-btn{border-color:var(--acc)}
.ic{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;font-style:normal}
.mov-txt{flex:1;min-width:0}
.mov-txt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-txt small{font-size:12px;color:var(--mudo)}
.mov-monto{font-weight:700;font-size:15px;flex:0 0 auto}
.dia{margin-bottom:14px}
.dia-cab{display:flex;justify-content:space-between;font-size:13px;color:var(--mudo);padding:0 4px 6px}
.dia-cab b{color:var(--texto)}

/* historial */
.mes-nav{display:flex;align-items:center;justify-content:space-between;background:var(--sup);border:1px solid var(--linea);border-radius:12px;padding:4px;margin-bottom:10px}
.mes-nav button{background:none;border:0;color:var(--texto);min-height:42px;min-width:44px;font-size:22px;border-radius:9px;line-height:1}
.mes-nav button[disabled]{color:var(--linea)}
.mes-nav .mes-label{font-size:15px;font-weight:600;text-transform:capitalize;flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--sup);border:1px solid var(--linea);border-radius:999px;padding:8px 14px;min-height:40px;font-size:13px;color:var(--texto)}
.chip.on{background:var(--c,var(--acc2));border-color:var(--c,var(--acc2));color:#0C1822;font-weight:600}

/* resumen */
.segm{display:flex;gap:6px;background:var(--sup);border:1px solid var(--linea);border-radius:12px;padding:4px;margin-bottom:12px}
.segm button{flex:1;background:none;border:0;border-radius:9px;padding:9px 2px;font-size:13px;color:var(--mudo);min-height:40px}
.segm button.on{background:var(--sup2);color:var(--texto);font-weight:600}
.cifras{display:flex;gap:10px;margin-bottom:12px}
.cifra{flex:1;min-width:0;background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:12px}
.cifra b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cifra small{font-size:11.5px;color:var(--mudo);display:block;line-height:1.25}
.tarjeta{background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:12px}
.titulo-card{margin:0 0 10px;font-size:13px;color:var(--mudo)}
.fila-sb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fila-sb .titulo-card{margin:0}
.mudo{color:var(--mudo);font-size:13px;margin:6px 0 0}
.destacado{margin:8px 0 0;font-size:14px}
.destacado b{color:var(--ok)}
.destacado.mal b{color:var(--pr)}
.prog{height:10px;background:var(--sup2);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:6px}
.pres-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pres-form label{flex:1;display:flex;align-items:center;gap:6px;background:var(--sup2);border:1px solid var(--linea);border-radius:12px;padding:0 12px;min-height:48px;min-width:140px}
.pres-form label span{color:var(--mudo);font-weight:600}
.pres-form input{flex:1;width:100%;background:transparent;border:0;outline:none;font-size:18px;font-weight:600;min-height:46px}
.cats-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.cl-cab{display:flex;align-items:baseline;gap:8px;font-size:14px}
.cl-cab span{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.cl-cab i{font-style:normal}
.cl-cab b{font-weight:600}
.cl-cab small{color:var(--mudo);font-size:12px;min-width:36px;text-align:right}
.track{height:8px;background:var(--sup2);border-radius:5px;overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;border-radius:5px}
.vacio{background:var(--sup);border:1px dashed var(--linea);border-radius:14px;padding:22px 16px;text-align:center;color:var(--mudo);font-size:14px}
.datos{display:flex;flex-direction:column;gap:8px}
.datos button,.datos label{background:var(--sup);border:1px solid var(--linea);border-radius:12px;padding:13px;font-size:14px;text-align:left;min-height:48px;display:block;color:var(--texto)}
.datos input[type=file]{display:none}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;background:#0A141C;border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:var(--mudo);padding:10px 4px;min-height:58px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}
.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;
  background:var(--ok);color:#0A2113;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;
  max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .18s;pointer-events:none}
.aviso.ver{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="vista"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="registrar" class="on"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Registrar</button>
    <button data-tab="historial"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Historial</button>
    <button data-tab="resumen"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-6"/></svg>Resumen</button>
  </nav>
  <div class="aviso" id="aviso"></div>
</div>

<script>
/* ============ categorías ============ */
const CATS=[
 {id:'comida',n:'Comida fuera',e:'🍽️',c:'#F5A623'},
 {id:'mercado',n:'Mercado',e:'🛒',c:'#8BE28B'},
 {id:'transporte',n:'Transporte',e:'🚌',c:'#3FC8F0'},
 {id:'casa',n:'Casa y servicios',e:'🏠',c:'#B39DDB'},
 {id:'salud',n:'Salud',e:'💊',c:'#F0699B'},
 {id:'ocio',n:'Ocio',e:'🎬',c:'#FFD54F'},
 {id:'ropa',n:'Ropa',e:'👕',c:'#FF8A65'},
 {id:'educacion',n:'Educación',e:'📚',c:'#4DB6AC'},
 {id:'suscripciones',n:'Suscripciones',e:'📱',c:'#9FA8DA'},
 {id:'deporte',n:'Deporte',e:'🏋️',c:'#AED581'},
 {id:'regalos',n:'Regalos',e:'🎁',c:'#F48FB1'},
 {id:'otros',n:'Otros',e:'📦',c:'#90A4AE'}
];
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];

/* ============ almacenamiento ============ */
const Guarda=(()=>{
  const ls=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}catch(e){return null;}})();
  const mem={};
  return{
    leer(k){if(ls){try{const v=ls.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}return mem[k]??null;},
    escribir(k,v){const s=JSON.stringify(v);if(ls){try{ls.setItem(k,s);return true;}catch(e){return false;}}mem[k]=v;return true;}
  };
})();
const K_MOV='gastos:movs',K_PRE='gastos:presupuesto';

/* ============ estado ============ */
let movs=[],presupuesto=null,tab='registrar';
let form={monto:0,cat:null,nota:'',fecha:null,editando:null};
let mesHist=null,filtroCat='todas';
let periodo='mes',presEdit=false;

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const aISO=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hoy=()=>aISO(new Date());
const fechaObj=f=>new Date(f+'T12:00');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_S=['dom','lun','mar','mié','jue','vie','sáb'];
function sumarDias(f,n){const d=fechaObj(f);d.setDate(d.getDate()+n);return aISO(d);}
const ayer=()=>sumarDias(hoy(),-1);
function fechaCorta(f){const d=fechaObj(f);return DIAS_S[d.getDay()]+' '+d.getDate()+' '+MESES_C[d.getMonth()]+(f.slice(0,4)!==hoy().slice(0,4)?' '+f.slice(0,4):'');}
const etiquetaDia=f=>f===hoy()?'Hoy':f===ayer()?'Ayer':fechaCorta(f);
const mesLabel=m=>MESES[+m.slice(5,7)-1]+' '+m.slice(0,4);
const diasEnMes=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
function mesAnterior(m){const a=+m.slice(0,4),mm=+m.slice(5,7);return mm===1?(a-1)+'-12':a+'-'+p2(mm-1);}
function mesSiguiente(m){const a=+m.slice(0,4),mm=+m.slice(5,7);return mm===12?(a+1)+'-01':a+'-'+p2(mm+1);}
const nuevoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const suma=a=>a.reduce((t,m)=>t+m.monto,0);
const ordenRec=(a,b)=>b.fecha.localeCompare(a.fecha)||b.creado-a.creado;
function avisar(t){const a=$('#aviso');a.textContent=t;a.classList.add('ver');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('ver'),2400);}
function porCategoria(lista){const m={};lista.forEach(x=>m[x.cat]=(m[x.cat]||0)+x.monto);return Object.entries(m).map(([id,v])=>({cat:cat(id),v})).sort((a,b)=>b.v-a.v);}

/* ============ arranque ============ */
(function init(){
  movs=(Guarda.leer(K_MOV)||[]).filter(m=>m&&m.id&&m.fecha&&m.monto>0);
  presupuesto=Guarda.leer(K_PRE);
  form.fecha=hoy();mesHist=hoy().slice(0,7);
  pintar();
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)irA(b.dataset.tab);});
})();
function irA(t){
  tab=t;
  [...$('#tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
  window.scrollTo(0,0);pintar();
}
function pintar(){tab==='registrar'?vistaRegistrar():tab==='historial'?vistaHistorial():vistaResumen();}
function guardarMovs(){Guarda.escribir(K_MOV,movs);}

/* ============ registrar ============ */
/* conFecha: en listas que mezclan varios días (Resumen) se muestra el día debajo del nombre. */
function itemMov(m,conFecha){
  const c=cat(m.cat);
  const detalle=[conFecha?etiquetaDia(m.fecha):'',m.nota?c.n:''].filter(Boolean).join(' · ');
  return `<li class="mov ${form.editando===m.id?'edit':''}"><button class="mov-btn" data-id="${m.id}" aria-label="Editar ${esc(m.nota||c.n)}, ${fmt(m.monto)}">
    <i class="ic" style="background:${c.c}26">${c.e}</i>
    <div class="mov-txt"><b>${esc(m.nota||c.n)}</b>${detalle?`<small>${detalle}</small>`:''}</div>
    <span class="mov-monto">${fmt(m.monto)}</span></button></li>`;
}
function vistaRegistrar(){
  const f=form.fecha,lista=movs.filter(m=>m.fecha===f).sort((a,b)=>b.creado-a.creado),total=suma(lista);
  const listo=form.monto>0&&!!form.cat;
  $('#top').innerHTML=`<div class="top-fila"><div><h1>${form.editando?'Editar gasto':'Nuevo gasto'}</h1>
    <p class="sub">${etiquetaDia(f)} · ${lista.length?lista.length+(lista.length===1?' gasto · ':' gastos · ')+fmt(total):'sin gastos todavía'}</p></div></div>`;
  $('#top').onclick=null;
  $('#vista').innerHTML=`
    <section class="form">
      <label class="monto"><span>$</span><input id="monto" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Monto en pesos"
        value="${form.monto?form.monto.toLocaleString('es-CO'):''}"></label>
      <div class="cats" role="group" aria-label="Categoría">${CATS.map(c=>`
        <button class="cat ${form.cat===c.id?'on':''}" data-cat="${c.id}" style="--c:${c.c}" aria-pressed="${form.cat===c.id}"><span aria-hidden="true">${c.e}</span>${c.n}</button>`).join('')}</div>
      <div class="fila">
        <input id="nota" class="texto" placeholder="Nota (opcional)" maxlength="60" autocomplete="off" value="${esc(form.nota)}" aria-label="Nota">
        <input id="fecha" class="fecha" type="date" value="${f}" aria-label="Fecha">
      </div>
      <div class="acciones">
        <button class="guardar" id="btnGuardar" ${listo?'':'disabled'}>${form.editando?'Guardar cambios':'Guardar gasto'}</button>
        ${form.editando?`<button class="mini" id="btnCancelar">Cancelar</button><button class="borrar" id="btnBorrar">Eliminar</button>`:''}
      </div>
    </section>
    <p class="seccion"><span>${etiquetaDia(f)}</span>${lista.length?`<b>${fmt(total)}</b>`:''}</p>
    ${lista.length?`<ul class="movs">${lista.map(itemMov).join('')}</ul>`
      :`<div class="vacio">Aún no hay gastos ${f===hoy()?'hoy':'este día'}.<br>Apunta el primero arriba: monto, categoría y listo.</div>`}`;

  $('#vista').oninput=e=>{
    if(e.target.id==='monto'){
      const d=e.target.value.replace(/\D/g,'').slice(0,12);
      form.monto=d?parseInt(d,10):0;
      e.target.value=form.monto?form.monto.toLocaleString('es-CO'):'';
      actualizarBoton();
    }
    if(e.target.id==='nota')form.nota=e.target.value;
  };
  $('#vista').onchange=e=>{if(e.target.id==='fecha'){form.fecha=e.target.value||hoy();vistaRegistrar();}};
  $('#vista').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.cat){
      form.cat=b.dataset.cat;
      document.querySelectorAll('.cat').forEach(x=>{const on=x.dataset.cat===form.cat;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
      actualizarBoton();return;
    }
    if(b.id==='btnGuardar')return guardarMov();
    if(b.id==='btnCancelar'){limpiarForm();vistaRegistrar();return;}
    if(b.id==='btnBorrar')return borrarMov(form.editando);
    if(b.dataset.id){editar(b.dataset.id);vistaRegistrar();window.scrollTo(0,0);}
  };
}
function actualizarBoton(){const g=$('#btnGuardar');if(g)g.disabled=!(form.monto>0&&form.cat);}
function limpiarForm(){form={monto:0,cat:null,nota:'',fecha:form.fecha,editando:null};}
function editar(id){
  const m=movs.find(x=>x.id===id);if(!m)return;
  form={monto:m.monto,cat:m.cat,nota:m.nota||'',fecha:m.fecha,editando:m.id};
}
function guardarMov(){
  if(!(form.monto>0&&form.cat))return;
  const nota=form.nota.trim();
  if(form.editando){
    const m=movs.find(x=>x.id===form.editando);
    if(m){m.monto=form.monto;m.cat=form.cat;m.nota=nota;m.fecha=form.fecha;}
    avisar('Gasto actualizado');
  }else{
    movs.push({id:nuevoId(),fecha:form.fecha,monto:form.monto,cat:form.cat,nota,creado:Date.now()});
    avisar('Guardado · '+fmt(form.monto)+' en '+cat(form.cat).n.toLowerCase());
  }
  guardarMovs();limpiarForm();vistaRegistrar();
}
function borrarMov(id){
  const m=movs.find(x=>x.id===id);if(!m)return;
  if(!confirm('¿Eliminar este gasto de '+fmt(m.monto)+'? No se puede deshacer.'))return;
  movs=movs.filter(x=>x.id!==id);guardarMovs();
  if(form.editando===id)limpiarForm();
  pintar();avisar('Gasto eliminado');
}

/* ============ historial ============ */
function vistaHistorial(){
  const m=mesHist,delMes=movs.filter(x=>x.fecha.slice(0,7)===m);
  const catsMes=porCategoria(delMes);
  if(filtroCat!=='todas'&&!catsMes.some(x=>x.cat.id===filtroCat))filtroCat='todas';
  const lista=(filtroCat==='todas'?delMes:delMes.filter(x=>x.cat===filtroCat)).sort(ordenRec);
  const total=suma(lista);
  $('#top').innerHTML=`<div class="top-fila"><div><h1>Historial</h1>
    <p class="sub">${lista.length?lista.length+(lista.length===1?' gasto · ':' gastos · ')+fmt(total):'sin gastos en '+mesLabel(m)}</p></div></div>`;
  $('#top').onclick=null;

  const dias=[...new Set(lista.map(x=>x.fecha))].sort().reverse();
  const cuerpo=dias.length?dias.map(f=>{
      const del=lista.filter(x=>x.fecha===f);
      return `<div class="dia"><div class="dia-cab"><span>${etiquetaDia(f)}</span><b>${fmt(suma(del))}</b></div><ul class="movs">${del.map(itemMov).join('')}</ul></div>`;
    }).join('')
    :`<div class="vacio">No hay gastos en ${mesLabel(m)}${filtroCat!=='todas'?' de esta categoría':''}.</div>`;

  $('#vista').innerHTML=`
    <div class="mes-nav">
      <button data-mes="-1" aria-label="Mes anterior">‹</button>
      <button class="mes-label" id="mesHoy" title="Ir al mes actual">${mesLabel(m)}</button>
      <button data-mes="1" aria-label="Mes siguiente" ${m>=hoy().slice(0,7)?'disabled':''}>›</button>
    </div>
    ${catsMes.length>1?`<div class="chips"><button class="chip ${filtroCat==='todas'?'on':''}" data-f="todas">Todas</button>${catsMes.map(x=>`
      <button class="chip ${filtroCat===x.cat.id?'on':''}" data-f="${x.cat.id}" style="--c:${x.cat.c}">${x.cat.e} ${x.cat.n}</button>`).join('')}</div>`:''}
    ${cuerpo}${bloqueDatos()}`;

  $('#vista').oninput=null;$('#vista').onchange=null;
  $('#vista').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.mes){mesHist=b.dataset.mes==='1'?mesSiguiente(mesHist):mesAnterior(mesHist);vistaHistorial();return;}
    if(b.id==='mesHoy'){mesHist=hoy().slice(0,7);vistaHistorial();return;}
    if(b.dataset.f){filtroCat=b.dataset.f;vistaHistorial();return;}
    if(b.dataset.id){editar(b.dataset.id);irA('registrar');return;}
    if(b.id==='expJson')exportarJSON();
    if(b.id==='expCsv')exportarCSV();
  };
  const f=$('#impFile');if(f)f.addEventListener('change',importar);
}
function bloqueDatos(){
  return `<p class="seccion"><span>Copias de seguridad</span></p><div class="datos">
    <button id="expJson">Descargar copia completa (.json)</button>
    <button id="expCsv">Exportar a Excel (.csv)</button>
    <label>Restaurar desde una copia<input type="file" id="impFile" accept=".json,application/json"></label></div>`;
}
/* En iPhone/Android la descarga directa no siempre funciona dentro de una app instalada:
   si se puede, se abre la hoja de compartir (guardar en Archivos, enviar por WhatsApp...). Devuelve true en ese caso. */
function bajar(nombre,texto,tipo){
  const blob=new Blob([texto],{type:tipo});
  const movil=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(movil&&navigator.canShare){
    try{
      const f=new File([blob],nombre,{type:tipo});
      if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:nombre}).catch(()=>{});return true;}
    }catch(e){}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return false;
}
function exportarJSON(){
  const c=bajar('gastos-'+hoy()+'.json',JSON.stringify({version:1,presupuesto,movimientos:movs},null,2),'application/json');
  avisar(c?'Elige dónde guardar la copia':'Copia descargada');
}
function exportarCSV(){
  const filas=[['Fecha','Categoría','Nota','Monto (COP)']];
  [...movs].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.creado-b.creado)
    .forEach(m=>filas.push([m.fecha,cat(m.cat).n,m.nota||'',m.monto]));
  const csv='﻿'+filas.map(f=>f.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const c=bajar('gastos-'+hoy()+'.csv',csv,'text/csv');
  avisar(c?'Elige dónde guardar el CSV':'CSV descargado');
}
function importar(ev){
  const file=ev.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const datos=JSON.parse(r.result);
      const nuevos=Array.isArray(datos)?datos:datos.movimientos;
      if(!Array.isArray(nuevos))throw new Error('formato');
      const ids=new Set(movs.map(m=>m.id));let n=0;
      nuevos.forEach(m=>{if(m&&m.id&&m.fecha&&m.monto>0&&!ids.has(m.id)){movs.push({id:m.id,fecha:m.fecha,monto:+m.monto,cat:cat(m.cat).id,nota:m.nota||'',creado:m.creado||Date.now()});n++;}});
      if(datos.presupuesto>0&&!presupuesto){presupuesto=+datos.presupuesto;Guarda.escribir(K_PRE,presupuesto);}
      guardarMovs();vistaHistorial();avisar(n?'Copia restaurada · '+n+' gastos nuevos':'No había gastos nuevos en la copia');
    }catch(e){avisar('El archivo no es una copia válida');}
  };
  r.readAsText(file);
}

/* ============ resumen ============ */
/* Cada período trae su rango, los días transcurridos (para el promedio) y el período anterior comparable. */
function rango(p){
  const h=hoy(),m=h.slice(0,7),dHoy=+h.slice(8,10);
  const ultimo=mm=>mm+'-'+p2(diasEnMes(mm));
  if(p==='semana')return{nombre:'Últimos 7 días',desde:sumarDias(h,-6),hasta:h,dias:7,eje:'dia',
    ant:{desde:sumarDias(h,-13),hasta:sumarDias(h,-7)},antNombre:'los 7 días anteriores'};
  if(p==='mes'){const pm=mesAnterior(m);return{nombre:mesLabel(m),desde:m+'-01',hasta:ultimo(m),dias:dHoy,eje:'dia',
    ant:{desde:pm+'-01',hasta:pm+'-'+p2(Math.min(dHoy,diasEnMes(pm)))},antNombre:'el mes pasado a esta fecha'};}
  if(p==='mesPasado'){const pm=mesAnterior(m),ppm=mesAnterior(pm);return{nombre:mesLabel(pm),desde:pm+'-01',hasta:ultimo(pm),dias:diasEnMes(pm),eje:'dia',
    ant:{desde:ppm+'-01',hasta:ultimo(ppm)},antNombre:mesLabel(ppm)};}
  const a=h.slice(0,4),aa=String(+a-1),doy=Math.round((fechaObj(h)-fechaObj(a+'-01-01'))/864e5)+1;
  return{nombre:a,desde:a+'-01-01',hasta:a+'-12-31',dias:doy,eje:'mes',ant:{desde:aa+'-01-01',hasta:aa+h.slice(4)},antNombre:aa+' a esta fecha'};
}
const enRango=r=>movs.filter(m=>m.fecha>=r.desde&&m.fecha<=r.hasta);
function serieDias(lista,r){
  const m={};lista.forEach(x=>m[x.fecha]=(m[x.fecha]||0)+x.monto);
  const out=[];let f=r.desde;
  while(f<=r.hasta){
    const d=fechaObj(f),dia=d.getDate();
    const et=periodo==='semana'?DIAS_S[d.getDay()]:(dia===1||dia%5===0?String(dia):'');
    out.push({et,v:m[f]||0,hoy:f===hoy()});f=sumarDias(f,1);
  }
  return out;
}
function serieMeses(lista,a){
  const m={};lista.forEach(x=>m[x.fecha.slice(0,7)]=(m[x.fecha.slice(0,7)]||0)+x.monto);
  return Array.from({length:12},(_,i)=>{const k=a+'-'+p2(i+1);return{et:MESES_C[i],v:m[k]||0,hoy:k===hoy().slice(0,7)};});
}
function barras(datos){
  const W=320,H=150,T=18,B=20,L=4,R=4,n=datos.length,max=Math.max(1,...datos.map(d=>d.v));
  const gw=(W-L-R)/n,bw=Math.max(2,Math.min(gw*0.7,26));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto por período">
    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#26434F"/>
    <text x="${L}" y="11" fill="#88A3B0" font-size="10">máximo ${fmt(max)}</text>
    ${datos.map((d,i)=>{
      const h=d.v?Math.max(2,d.v/max*(H-T-B)):0,x=L+i*gw+(gw-bw)/2,y=H-B-h;
      return (d.v?`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3,bw/2)}" fill="${d.hoy?'#3FC8F0':'#F5A623'}"/>`:'')
        +(d.et?`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" fill="#88A3B0" font-size="9.5" text-anchor="middle">${d.et}</text>`:'');
    }).join('')}
  </svg>`;
}
function barrasCat(lista,total){
  const pc=porCategoria(lista);
  if(!pc.length)return `<div class="vacio">Sin gastos en este período.</div>`;
  return `<ul class="cats-lista">${pc.map(x=>`<li>
    <div class="cl-cab"><span><i>${x.cat.e}</i>${x.cat.n}</span><b>${fmt(x.v)}</b><small>${Math.round(x.v/total*100)}%</small></div>
    <div class="track"><i style="width:${(x.v/pc[0].v*100).toFixed(1)}%;background:${x.cat.c}"></i></div></li>`).join('')}</ul>`;
}
function tarjetaPresupuesto(total){
  if(presEdit)return `<div class="tarjeta"><p class="titulo-card">Presupuesto del mes</p>
    <p class="mudo" style="margin:0">¿Cuánto quieres gastar como máximo cada mes?</p>
    <div class="pres-form"><label><span>$</span><input id="presInput" inputmode="numeric" autocomplete="off" placeholder="0" value="${presupuesto?presupuesto.toLocaleString('es-CO'):''}" aria-label="Presupuesto mensual"></label>
      <button class="mini" id="presGuardar">Guardar</button><button class="mini" id="presCancelar">Cancelar</button>${presupuesto?`<button class="borrar" id="presQuitar">Quitar</button>`:''}</div></div>`;
  if(!presupuesto)return `<div class="tarjeta"><div class="fila-sb"><p class="titulo-card">Presupuesto del mes</p><button class="enlace" id="btnPres">Definir</button></div>
    <p class="mudo">Define un tope mensual y verás cuánto te queda y cuánto puedes gastar por día.</p></div>`;
  const h=hoy(),faltan=diasEnMes(h.slice(0,7))-(+h.slice(8,10))+1,pct=Math.round(total/presupuesto*100),queda=presupuesto-total;
  const color=pct>=100?'var(--pr)':pct>=80?'var(--acc)':'var(--ok)';
  return `<div class="tarjeta"><div class="fila-sb"><p class="titulo-card">Presupuesto del mes</p><button class="enlace" id="btnPres">Cambiar</button></div>
    <div class="prog"><i style="width:${Math.min(100,pct)}%;background:${color}"></i></div>
    <p class="mudo">${fmt(total)} de ${fmt(presupuesto)} · ${pct}%</p>
    ${queda>=0?`<p class="destacado">Te quedan <b>${fmt(queda)}</b> · <b>${fmt(queda/faltan)}</b> por día para ${faltan===1?'hoy':'los '+faltan+' días que faltan'}</p>`
      :`<p class="destacado mal">Te pasaste por <b>${fmt(-queda)}</b></p>`}</div>`;
}
function vistaResumen(){
  const r=rango(periodo),lista=enRango(r),total=suma(lista),ant=suma(enRango(r.ant));
  const prom=total/Math.max(1,r.dias);
  const dif=ant>0?Math.round((total-ant)/ant*100):null;
  const top=[...lista].sort((a,b)=>b.monto-a.monto||ordenRec(a,b)).slice(0,5);
  $('#top').innerHTML=`<div class="top-fila"><div><h1>Resumen</h1><p class="sub">En qué se va tu dinero</p></div></div>`;
  $('#top').onclick=null;
  $('#vista').innerHTML=`
    <div class="segm" id="segm">
      <button data-p="semana" class="${periodo==='semana'?'on':''}">Semana</button>
      <button data-p="mes" class="${periodo==='mes'?'on':''}">Mes</button>
      <button data-p="mesPasado" class="${periodo==='mesPasado'?'on':''}">Mes pasado</button>
      <button data-p="anio" class="${periodo==='anio'?'on':''}">Año</button>
    </div>
    <div class="cifras">
      <div class="cifra"><b>${fmt(total)}</b><small>${r.nombre}</small></div>
      <div class="cifra"><b>${fmt(prom)}</b><small>por día</small></div>
      <div class="cifra"><b style="color:${dif===null?'var(--texto)':dif>0?'var(--pr)':'var(--ok)'}">${dif===null?'–':(dif>0?'+':'')+dif+'%'}</b><small>vs ${r.antNombre}</small></div>
    </div>
    ${periodo==='mes'?tarjetaPresupuesto(total):''}
    <div class="tarjeta"><p class="titulo-card">¿En qué se va?</p>${barrasCat(lista,total)}</div>
    ${lista.length?`<div class="tarjeta"><p class="titulo-card">Gasto por ${r.eje==='mes'?'mes':'día'}</p>${barras(r.eje==='mes'?serieMeses(lista,r.nombre):serieDias(lista,r))}</div>
    <div class="tarjeta"><p class="titulo-card">Gastos más grandes</p><ul class="movs">${top.map(m=>itemMov(m,true)).join('')}</ul></div>`:''}`;

  $('#vista').oninput=e=>{
    if(e.target.id==='presInput'){const d=e.target.value.replace(/\D/g,'').slice(0,12);e.target.value=d?parseInt(d,10).toLocaleString('es-CO'):'';}
  };
  $('#vista').onchange=null;
  $('#vista').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p){periodo=b.dataset.p;presEdit=false;vistaResumen();return;}
    if(b.id==='btnPres'){presEdit=true;vistaResumen();$('#presInput')?.focus();return;}
    if(b.id==='presCancelar'){presEdit=false;vistaResumen();return;}
    if(b.id==='presQuitar'){presupuesto=null;Guarda.escribir(K_PRE,null);presEdit=false;vistaResumen();avisar('Presupuesto quitado');return;}
    if(b.id==='presGuardar'){
      const v=parseInt(($('#presInput').value||'').replace(/\D/g,''),10);
      if(!(v>0)){avisar('Escribe un monto mayor que cero');return;}
      presupuesto=v;Guarda.escribir(K_PRE,presupuesto);presEdit=false;vistaResumen();avisar('Presupuesto: '+fmt(v)+' al mes');return;
    }
    if(b.dataset.id){editar(b.dataset.id);irA('registrar');}
  };
}

/* ============ PWA ============ */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
